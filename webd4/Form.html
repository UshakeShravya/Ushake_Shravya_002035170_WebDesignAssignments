<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <style>
        label {
            float: left;
            width: 150px;
        }
        #container {
            width: 700px;
            margin: auto;
            background-color: beige;
        }
        main {
            padding: 50px;
        }
        .error-message {
            color: red;
            font-size: 12px;
        }
        #charCounter {
            font-size: 12px;
            color: #555;
        }
        #resultsTable {
            margin-top: 20px;
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }
        #resultsTable th, #resultsTable td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #resultsTable th {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <div id="container">
        <main>
            <h2>Feedback</h2>
            <h3>Love something? Hate something? Let us know!</h3>
            Note: Fields marked with an asterisk (*) are mandatory.
            <br><br>

            <form method="post" id="feedbackForm" novalidate>
                <label>Title*:</label>
                <input type="radio" name="title" id="miss" value="miss" required /> Miss
                <input type="radio" name="title" id="mr" value="mr" required /> Mr.
                <input type="radio" name="title" id="mrs" value="mrs" required /> Mrs.
                <br><br>

                <label for="firstName">First Name*:</label>
                <input type="text" name="firstName" id="firstName" placeholder="First Name" />
                <span class="error-message" id="firstNameError"></span>
                <br><br>

                <label for="lastName">Last Name*:</label>
                <input type="text" name="lastName" id="lastName" placeholder="Last Name" />
                <span class="error-message" id="lastNameError"></span>
                <br><br>

                <label for="emailId">Email Id*:</label>
                <input type="text" name="emailId" id="emailId" placeholder="yourname@northeastern.edu" />
                <span class="error-message" id="emailError"></span>
                <br><br>

                <label for="phoneNumber">Phone Number*:</label>
                <input type="text" name="phoneNumber" id="phoneNumber" placeholder="(XXX) XXX-XXXX" />
                <span class="error-message" id="phoneError"></span>
                <br><br>

                <label for="zipcode">Zip Code*:</label>
                <input type="text" name="zipcode" id="zipcode" placeholder="xxxxxx" />
                <span class="error-message" id="zipError"></span>
                <br><br>

                <label for="options">Choose a Cupcake Flavor*:</label>
                <select id="options" name="options">
                    <option value="">-- Select --</option>
                    <option value="chocolate">Chocolate</option>
                    <option value="vanilla">Vanilla</option>
                    <option value="mango">Mango</option>
                    <option value="strawberry">Strawberry</option>
                    <option value="lemon">Lemon</option>
                </select>
                <br><br>

                <label for="address2">Street Address 2:</label>
                <input type="text" name="address2" id="address2" placeholder="Address Line 2" />
                <span id="charCounter">0/20 characters used</span>
                <br><br>

                <label for="comments">Comments*:</label>
                <textarea name="text" id="comments" placeholder="Your comments" rows="5" cols="25"></textarea>
                <span class="error-message" id="commentsError"></span>
                <br><br>

                <input type="submit" id="submitBtn" disabled>
                <input type="reset">
                <br><br>
            </form>

            <!-- Table to Display Submitted Data -->
            <h3>Submitted Data</h3>
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Zip Code</th>
                        <th>Flavor</th>
                        <th>Address 2</th>
                        <th>Comments</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
